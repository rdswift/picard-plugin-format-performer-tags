"manifest.description" = "Ce plugin offre des options relatives au formatage des balises d'interprète."
"manifest.long_description" = "Ce plugin propose des options relatives au formatage des balises d'interprète. Le format\ndes balises générées peut être personnalisé à l'aide des paramètres disponibles dans la page d'options.\n"
"manifest.name" = "Format des balises Performer"
"qt.FormatPerformerTagsOptionsPage.page.text" = "Ces paramètres déterminent le format des balises **Performer** générées. Le format est divisé en six parties : l'interprète ; l'instrument ou « voix » ; et quatre sections sélectionnables par l'utilisateur pour les informations supplémentaires. Il se présente comme suit :\n\n&nbsp;&nbsp;&nbsp; <strong>[Section 1]</strong>Instrument/Voix<strong>[Section 2][Section 3]</strong>: Interprète<strong>[Section 4]</strong>\n\nVous pouvez sélectionner la section dans laquelle apparaîtra chacune des informations supplémentaires.\n\nPour chacune des sections, vous pouvez sélectionner les caractères de début, les caractères séparant les entrées et les caractères de fin. Notez que les espaces avant ou après doivent être inclus dans les paramètres et ne seront pas ajoutés automatiquement. Si aucun caractère de séparation n'est saisi, les éléments d'une section seront automatiquement séparés par un seul espace."
