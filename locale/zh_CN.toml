"manifest.name" = "格式化表演者标签"
"qt.FormatPerformerTagsOptionsPage.page.text" = "这些设置将决定准备的任何 **Performer** 标签的格式。格式分为六个部分：表演者；乐器或“人声”；以及四个用户可选的额外信息部分。具体如下：\n\n&nbsp;&nbsp;&nbsp; <strong>[部分 1]</strong>乐器/人声<strong>[部分 2][部分 3]</strong>：表演者<strong>[部分 4]</strong>\n\n您可以选择每个额外信息词出现的部分。\n\n对于每个部分，您可以选择起始字符、分隔条目的字符以及结束字符。请注意，设置中必须包含前导或尾随空格，并且不会自动添加。如果未输入分隔字符，则该部分内的条目将自动用单个空格分隔。"
